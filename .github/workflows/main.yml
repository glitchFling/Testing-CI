name: Build WASM

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.57
          actions-cache-folder: emsdk-cache

      - name: Build main.cpp → index.js + index.wasm
        run: |
          emcc main.cpp -O3 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sEXPORTED_FUNCTIONS='["_hash1024_c","_hash2048_c","_hash4096_c"]' \
            -sEXPORTED_RUNTIME_METHODS='["cwrap"]' \
            -o index.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            index.js
            index.wasm
